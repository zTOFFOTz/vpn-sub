# FF Full VPN Config — Clash Verge Rev / Mihomo
# Обновлено: 15.06.2026
# Steam/Dota + старые правила: Roblox, ChatGPT, Discord, YouTube/Google, Telegram, GitHub, Cloudflare, Epic, Ollama, NVIDIA, HuggingFace, LM Studio.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: firefox
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
  - any:53
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
  force-domain:
  - +.steamcommunity.com
  - +.steampowered.com
  - +.steamcontent.com
  - +.dota2.com
  - +.valve.net
  - +.roblox.com
  - +.chatgpt.com
  - +.openai.com
  - +.discord.com
  - +.youtube.com
  - +.googlevideo.com
  - +.github.com
  - +.ollama.com
  - +.nvidia.com
  - +.huggingface.co
  - +.lmstudio.ai
  skip-domain:
  - +.lan
  - +.local
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.localhost'
  - localhost.ptlogin2.qq.com
  - '*.steamcontent.com'
  - '*.steamstatic.com'
  - '*.steampowered.com'
  - '*.steamcommunity.com'
  - '*.valve.net'
  - '*.dota2.com'
  default-nameserver: [1.1.1.1, 8.8.8.8]
  nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
  proxy-server-nameserver:
  - https://1.1.1.1/dns-query
  direct-nameserver: [1.1.1.1, 8.8.8.8]
