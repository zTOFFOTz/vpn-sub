# FF Clash/Mihomo profile
# Source: existing working servers from zTOFFOTz/vpn-sub/sub.txt
# Logic: RU sites/IP -> DIRECT, ChatGPT/OpenAI -> existing Germany/EU servers, others -> proxy group.

port: 7890
socks-port: 7891
mixed-port: 7897
redir-port: 7892
tproxy-port: 7893
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
find-process-mode: strict
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geodata-loader: standard
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: false

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - any:53
    - tcp://any:53

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
  force-domain:
    - +.chatgpt.com
    - +.openai.com
    - +.oaistatic.com
    - +.oaiusercontent.com
    - +.openaiusercontent.com
    - +.chat.com
    - +.auth0.com
    - +.arkoselabs.com
  skip-domain:
    - +.lan
    - +.local
    - +.ru
    - +.рф
    - +.su
    - +.gosuslugi.ru
    - +.ozon.ru
    - +.wildberries.ru
    - +.yandex.ru
    - +.vk.com
    - +.mail.ru

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
    - 77.88.8.8
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - 77.88.8.8
  proxy-server-nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  direct-nameserver:
    - 77.88.8.8
    - 8.8.8.8
  nameserver-policy:
    "+.ru": [77.88.8.8, 8.8.8.8]
    "+.рф": [77.88.8.8, 8.8.8.8]
    "+.su": [77.88.8.8, 8.8.8.8]
    "+.gosuslugi.ru": [77.88.8.8, 8.8.8.8]
    "+.gu-st.ru": [77.88.8.8, 8.8.8.8]
    "+.ozon.ru": [77.88.8.8, 8.8.8.8]
    "+.o3.ru": [77.88.8.8, 8.8.8.8]
    "+.wildberries.ru": [77.88.8.8, 8.8.8.8]
    "+.wb.ru": [77.88.8.8, 8.8.8.8]
    "+.yandex.ru": [77.88.8.8, 8.8.8.8]
    "+.ya.ru": [77.88.8.8, 8.8.8.8]
    "+.vk.com": [77.88.8.8, 8.8.8.8]
    "+.mail.ru": [77.88.8.8, 8.8.8.8]
    "+.chatgpt.com": [https://cloudflare-dns.com/dns-query, https://dns.google/dns-query]
    "+.openai.com": [https://cloudflare-dns.com/dns-query, https://dns.google/dns-query]
    "+.oaistatic.com": [https://cloudflare-dns.com/dns-query, https://dns.google/dns-query]
    "+.oaiusercontent.com": [https://cloudflare-dns.com/dns-query, https://dns.google/dns-query]

