proxy-groups:
  - name: 🚀 PROXY
    type: select
    proxies:
      - 🤖 CHATGPT_OPENAI
      - 🇩🇪 GERMANY_AUTO
      - 🇩🇪 Германия Автовыбор №2
      - 🇩🇪 Германия №4
      - 🇪🇺 EU_AUTO
      - 🇪🇺 Обход все операторы №13
      - 🇪🇺 Обход все операторы №14
      - DIRECT

  - name: 🤖 CHATGPT_OPENAI
    type: select
    proxies:
      - 🇩🇪 GERMANY_AUTO
      - 🇩🇪 Германия Автовыбор №2
      - 🇩🇪 Германия №4
      - 🇪🇺 EU_AUTO
      - 🇪🇺 Обход все операторы №13
      - 🇪🇺 Обход все операторы №14
      - DIRECT

  - name: 🇩🇪 GERMANY_AUTO
    type: url-test
    proxies:
      - 🇩🇪 Германия Автовыбор №2
      - 🇩🇪 Германия №4
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 80

  - name: 🇪🇺 EU_AUTO
    type: url-test
    proxies:
      - 🇪🇺 Обход все операторы №13
      - 🇪🇺 Обход все операторы №14
      - 🇩🇪 Германия Автовыбор №2
      - 🇩🇪 Германия №4
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 100

  - name: ▶️ YOUTUBE
    type: select
    proxies:
      - DIRECT
      - 🇷🇺 Ютуб без рекламы
      - 🚀 PROXY

